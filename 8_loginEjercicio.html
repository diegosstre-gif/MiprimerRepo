<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">


</head>
<style>
    body {
        background: url(mi-imagen2.jpg);
        text-align: center;
        padding: 250px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    form {
        display: flex;
        flex-direction: column;
        padding: 50px;
        width: 600px;
        width: 400px;
        border-radius: 20px;
        /* border: 1px solid black; */
        align-items: center;
        margin: auto;
        margin-top: 50px;
         background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 20px red;
    }



    h1 {
        color: white;
        font-size: 2rem;
        border-bottom: 4px solid white;
        margin-bottom: 30px;
    }

    .icono {
        font-size: 4rem;
        color: white;
        margin-bottom: 20px;
    }

    .box {
        margin: 15px;
            padding: 15px;
            width: 250px;
            border-radius: 15px;
            border: none;
            outline: none;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            text-align: center;
    }

    .box:hover {
        background-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 10px greenyellow;
    }

    #submit {
        margin-top: 20px;
        padding: 12px 20px;
        width: 200px;
        border-radius: 15px;
        border: none;
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #submit:hover {
        background-color: rgba(0, 255, 0, 0.2);
        color: white;
        box-shadow: 0 0 10px greenyellow;
    }
</style>

<body>
    <form action="">

        <h1>LOGIN</h1>
        <i class="fa-solid fa-circle-user icono"></i>
        <input class="box" type="email" name="email" placeholder="Ingresa Usuario">
        <input class="box" type="password" name="email" placeholder="Contraseña">
        <input type="submit" value="LOGIN" id="submit">
    </form>
</body>

</html>
